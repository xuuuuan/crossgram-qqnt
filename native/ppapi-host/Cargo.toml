[package]
name = "qqnt-ppapi-host"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Passive, role-gated PPAPI AVSDK loader metadata observer"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
synthetic-profile = []

[[bin]]
name = "ppapi-host-collector"
path = "src/bin/collector.rs"

[dependencies]
libc = "0.2.183"
sha2 = { version = "0.10.9", default-features = false }

[build-dependencies]
cc = "1.2.56"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
lto = true
panic = "abort"
strip = "symbols"
codegen-units = 1
